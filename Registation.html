<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>regestration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
*{

    
    

}body{
    
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    align-items: center;
    justify-content: center;
    display: flex;
    background-image: url(https://www.freecodecamp.org/news/content/images/size/w2000/2022/09/jonatan-pie-3l3RwQdHRHg-unsplash.jpg);
     background-repeat: no-repeat;
     background-size: cover;
     background-position: center;
    
}input{
    padding: 20px;
    text-align: center;
    margin: 10px;
    width: 300px;
    align-items: center;
    display: flex;
    justify-content: center;
}a{
    text-decoration:underline;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

    </style>
</head>
<body>
    <div class="container">
        
        <h1 class="Rigestration">Registration</h1><br>
        <!--First Name-->
        <label for="Firstname"> <i class="fa-solid fa-address-card"></i> First Name</label>
        <input type="text" name="Firstname" id="Firstname"  placeholder="Enter First Name"  required> 
<!--Last Name-->

        <label for="Lastname"> <i class="fa-solid fa-address-card"></i> Last  Name</label>
        <input type="text" name="Lastname" id="Lastname"  placeholder="Enter Last Name" required> 

        <!--Email-->
        <label for="Email"> <i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" name="Email" id="Email" placeholder="Enter Email" required> 

        <!--Password-->
        <label for="Password"> <i class="fa-solid fa-key"></i> Password</label>
        <input type="password" name="Password" id="Password" placeholder="Enter Password"  required>

        <!--Confirm Password-->
        <label for="Confirm Password"> <i class="fa-solid fa-key"></i> Confirm password<label>
        <input type="password" name="confirm password" id="confirmpassword" placeholder="Confirm Password" required> 

        <button type="submit">submit</button>
        <a href="Login.html">Have an account?</a>

    </div>
</body>
</html>
